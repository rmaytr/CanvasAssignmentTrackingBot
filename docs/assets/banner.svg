<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Canvas Assignment Tracker Bot</title>
  <desc id="d">A Telegram bot that turns your Canvas To Do list into a ranked morning list and reminders until you submit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2483d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37aee2"/>
      <stop offset="1" stop-color="#1e96c8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0 64H1280M0 128H1280M0 192H1280M0 256H1280"/>
    <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>

  <!-- calendar card -->
  <g transform="translate(96 70)">
    <rect width="168" height="180" rx="20" fill="#ffffff"/>
    <rect width="168" height="52" rx="20" fill="url(#accent)"/>
    <rect y="32" width="168" height="20" fill="url(#accent)"/>
    <circle cx="44" cy="8" r="9" fill="#0f172a"/>
    <circle cx="124" cy="8" r="9" fill="#0f172a"/>
    <g fill="#e5e7eb">
      <rect x="22" y="72" width="28" height="22" rx="5"/>
      <rect x="70" y="72" width="28" height="22" rx="5"/>
      <rect x="22" y="108" width="28" height="22" rx="5"/>
      <rect x="70" y="108" width="28" height="22" rx="5"/>
      <rect x="118" y="108" width="28" height="22" rx="5"/>
      <rect x="22" y="144" width="28" height="22" rx="5"/>
      <rect x="70" y="144" width="28" height="22" rx="5"/>
    </g>
    <rect x="118" y="72" width="28" height="22" rx="5" fill="#e2483d"/>
    <path d="M124 154l6 6 12-13" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- telegram bubble -->
  <g transform="translate(252 186)">
    <circle cx="44" cy="44" r="44" fill="url(#tg)" stroke="#0f172a" stroke-width="6"/>
    <path d="M22 43l42-17c3-1 5 1 4 4l-7 33c-1 3-3 4-6 2l-10-8-5 5c-1 1-2 1-3 0l1-9 19-17-24 14-9-3c-3-1-3-3-2-4z" fill="#ffffff"/>
  </g>

  <text x="380" y="138" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Canvas Assignment Tracker</text>
  <text x="382" y="186" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#cbd5e1">Your Canvas To Do list, ranked every morning, with reminders</text>
  <text x="382" y="218" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#cbd5e1">every 2 hours until you actually submit.</text>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="382" y="244" width="146" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="455" y="267" text-anchor="middle" fill="#ffffff">Telegram bot</text>
    <rect x="540" y="244" width="166" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="623" y="267" text-anchor="middle" fill="#ffffff">Canvas LMS API</text>
    <rect x="718" y="244" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="783" y="267" text-anchor="middle" fill="#ffffff">Python 3.13</text>
    <rect x="860" y="244" width="146" height="34" rx="17" fill="url(#accent)"/>
    <text x="933" y="267" text-anchor="middle" fill="#ffffff">Private beta</text>
  </g>
</svg>
