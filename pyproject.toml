[project]
name = "canvas-tracker"
version = "0.1.0"
description = "Self-hosted bot that turns your Canvas To Do list into a ranked morning digest and repeat reminders on Telegram."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=22.8,<23",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.16,<3",
    "tzdata>=2026.5",
]

[project.scripts]
canvas-tracker = "canvas_tracker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "time-machine>=3.5",
    "hypothesis>=6.170",
    "respx>=0.23",
    "ruff>=0.17",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pip-audit>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_tracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["slow: long-running simulation tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs", "research_notes", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "DTZ", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["canvas_tracker"]
