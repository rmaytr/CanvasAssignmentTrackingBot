[project]
name = "canvas-tracker"
version = "0.2.0"
description = "Telegram bot that turns Canvas LMS To Do lists into ranked morning briefings and submission-aware reminders, for a small invite-only group."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
keywords = ["canvas", "canvas-lms", "telegram-bot", "reminders", "students", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "python-telegram-bot>=22.8,<23",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.16,<3",
    "tzdata>=2026.5",
    "cryptography>=50,<51",
]

[project.urls]
Homepage = "https://github.com/rmaytr/CanvasAssignmentTrackingBot"
Documentation = "https://github.com/rmaytr/CanvasAssignmentTrackingBot/tree/HEAD/docs"
Changelog = "https://github.com/rmaytr/CanvasAssignmentTrackingBot/blob/HEAD/CHANGELOG.md"
Issues = "https://github.com/rmaytr/CanvasAssignmentTrackingBot/issues"

[project.scripts]
canvas-tracker = "canvas_tracker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "time-machine>=3.5",
    "hypothesis>=6.170",
    "respx>=0.23",
    "ruff>=0.17",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pip-audit>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_tracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["slow: long-running simulation tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "DTZ", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "ASYNC240"]
"src/canvas_tracker/render/copy.py" = ["S105"]  # message texts that mention "token"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["canvas_tracker"]
