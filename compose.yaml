# One shared bot for you and your friends. Set up with deploy/install.sh, or see
# docs/setup/host-the-bot.md. Start: docker compose up -d --build
services:
  bot:
    image: canvas-tracker:local
    build: .
    env_file: .env
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TOKEN_KEY_FILE: /run/secrets/token_key
      DATA_DIR: /data
    secrets:
      - telegram_bot_token
      - token_key
    volumes:
      - data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 400m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  token_key:
    file: ./secrets/token_key.txt  # encrypts everyone's Canvas tokens; back it up

volumes:
  data:
