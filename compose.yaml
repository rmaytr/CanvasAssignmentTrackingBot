# Run with: docker compose up -d --build   (see docs/setup/run-mvp.md)
services:
  bot:
    image: canvas-tracker:dev
    build: .
    env_file: .env
    environment:
      CANVAS_TOKEN_FILE: /run/secrets/canvas_token
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets:
      - canvas_token
      - telegram_bot_token
    volumes:
      - data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  canvas_token:
    file: ./secrets/canvas_token.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt

volumes:
  data:
